spring.application.name=bean-refresh

# Cache refresh every 4 hours by default
app.cache.cron=0 0 */4 * * *
app.cache.ttl-hours=4

# Logging for demo visualization
logging.level.com.example.bean_refresh=INFO

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

